# Reverse proxy cho chat.desiglobal.vn
# Cloudflare (Full strict) -> server :443 (Origin Cert) -> web container :18081
# Cài đặt: copy file này vào /etc/nginx/conf.d/chat.desiglobal.vn.conf rồi `nginx -t && systemctl reload nginx`

# --- Khôi phục IP thật của khách (Cloudflare đặt IP của họ vào remote_addr) ---
# Nguồn dải IP: https://www.cloudflare.com/ips/  (cập nhật khi Cloudflare thay đổi)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- HTTP :80 -> ép sang HTTPS (Cloudflare cũng nên bật Always Use HTTPS) ---
server {
    listen      80;
    listen      [::]:80;
    server_name chat.desiglobal.vn;
    return 301 https://$host$request_uri;
}

# --- HTTPS :443 (terminate TLS bằng Cloudflare Origin Certificate) ---
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name chat.desiglobal.vn;

    ssl_certificate     /etc/ssl/cloudflare/chat.desiglobal.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/chat.desiglobal.vn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # (Tùy chọn, khuyến nghị) Authenticated Origin Pulls — chỉ chấp nhận kết nối từ Cloudflare:
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    client_max_body_size 25m;

    # Toàn bộ traffic (SPA + /api) đẩy về container web; web nội bộ tự proxy /api -> crawler:8080
    location / {
        proxy_pass         http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
